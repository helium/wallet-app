name: CI
on:
  push:
    branches: [main, refresh]
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install modules
        run: yarn
      - name: Run lint
        run: yarn lint
      - name: Run tests
        run: yarn test --passWithNoTests
