# Relaunches the app and brings it to the home screen:
# unlocks the PIN screen and closes the Migrate to World card.
# Both can appear seconds after launch, so each gets a wait, not one check.
appId: com.helium.wallet.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: Keypad.1
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible:
        id: Keypad.1
    file: enter-pin.yaml
# The Migrate to World card hides home from Maestro on iOS while it shows.
- extendedWaitUntil:
    visible:
      id: AccountView\.Balance|MigrateToWorld\.NotNow
    timeout: 30000
- runFlow: close-migrate-card.yaml
- extendedWaitUntil:
    visible:
      id: AccountView.Balance
    timeout: 10000
