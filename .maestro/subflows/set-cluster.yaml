# From home, opens Settings and selects the Solana cluster in ${CLUSTER}
# (devnet or mainnet-beta), then closes Settings.
appId: com.helium.wallet.app
---
- tapOn:
    id: AccountsTopNav.Settings
- scrollUntilVisible:
    element:
      id: Settings.Cluster
- tapOn:
    id: Settings.Cluster
- tapOn:
    id: ActionSheet.${CLUSTER}
- tapOn:
    id: Settings.Close
- extendedWaitUntil:
    visible:
      id: AccountView.Balance
    timeout: 30000
