# Forwards the blockchain-api Jupiter calls to the keyless lite-api host.
# blockchain-api always sends x-api-key, and Jupiter rejects a placeholder
# key with 401, so the proxy drops the header.
server {
  listen 8080;

  location / {
    proxy_pass https://lite-api.jup.ag;
    proxy_set_header Host lite-api.jup.ag;
    proxy_set_header x-api-key "";
    proxy_ssl_server_name on;
  }
}
